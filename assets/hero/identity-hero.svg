<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="PRITHIV // AI Engineering System">
  <title>PRITHIV // AI Engineering System</title>
  <desc>Signature Identity Hero for Prithiv — AI/ML Engineer &amp; Cloud Engineer</desc>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <clipPath id="heroClip">
      <rect x="150" y="44" width="600" height="60">
        <animate attributeName="y" from="104" to="44" begin="0.30s" dur="0.45s" fill="freeze"/>
        <animate attributeName="height" from="0" to="60" begin="0.30s" dur="0.45s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Frame Background & Grid -->
  <rect width="900" height="240" rx="10" fill="url(#heroBg)"/>
  <rect width="900" height="240" rx="10" fill="url(#dotGrid)"/>
  <rect x="0.5" y="0.5" width="899.0" height="239.0" rx="9.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Corner Reticles (+) -->
  <path d="M 12 18 L 12 12 L 18 12 M 882 12 L 888 12 L 888 18 M 12 222 L 12 228 L 18 228 M 882 228 L 888 228 L 888 222"
    fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.75"/>

  <!-- Top Rail Separator -->
  <line x1="0" y1="38" x2="900" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Top Left: System Signature -->
  <text x="32" y="24" fill="#8b949e" font-size="10.5" letter-spacing="1.5">
    PRITHIV // <tspan fill="#58a6ff">IDENTITY.SYS</tspan>
  </text>

  <!-- Top Right: System Status -->
  <text x="850" y="24" fill="#3fb950" font-size="10.5" font-weight="600" text-anchor="end" letter-spacing="1">
    OPEN TO INTERNSHIPS
  </text>
  <circle cx="862" cy="20" r="4.5" fill="#3fb950"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>

  <!-- Center Identity Anchor: PRITHIV -->
  <g clip-path="url(#heroClip)">
    <text x="450.0" y="98" fill="#f0f6fc" font-size="44" font-weight="800"
      text-anchor="middle" letter-spacing="8">PRITHIV</text>
  </g>

  <!-- Center Accent Rule -->
  <line x1="330" y1="112" x2="570" y2="112" stroke="#58a6ff" stroke-width="1.5">
    <animate attributeName="x1" from="450" to="330" begin="0.45s" dur="0.35s" fill="freeze"/>
    <animate attributeName="x2" from="450" to="570" begin="0.45s" dur="0.35s" fill="freeze"/>
  </line>
  <circle cx="450.0" cy="112" r="3" fill="#58a6ff"/>

  <!-- Center Subtitle: Role -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.40s" fill="freeze"/>
    <text x="450.0" y="142" fill="#c9d1d9" font-size="13.5" font-weight="700"
      text-anchor="middle" letter-spacing="2.5">AI/ML ENGINEER  |  CLOUD ENGINEER</text>

    <!-- Center Supporting Line -->
    <text x="450.0" y="166" fill="#8b949e" font-size="11"
      text-anchor="middle" letter-spacing="1">Autonomous Intelligent Systems · Enterprise Software Architecture · Chennai, India</text>
  </g>

  <!-- Bottom Rail Separator -->
  <line x1="0" y1="198" x2="900" y2="198" stroke="#30363d" stroke-width="1"/>

  <!-- Bottom Rail: System Channel Index -->
  <g font-size="10" letter-spacing="1.2">
    <!-- Channel 01 -->
    <text x="85" y="222" text-anchor="middle">
      <tspan fill="#58a6ff">01:</tspan> <tspan fill="#8b949e">AI / ML</tspan>
    </text>
    <circle cx="175" cy="219" r="1.5" fill="#30363d"/>

    <!-- Channel 02 -->
    <text x="265" y="222" text-anchor="middle">
      <tspan fill="#58a6ff">02:</tspan> <tspan fill="#8b949e">SYSTEMS</tspan>
    </text>
    <circle cx="355" cy="219" r="1.5" fill="#30363d"/>

    <!-- Channel 03 -->
    <text x="450" y="222" text-anchor="middle">
      <tspan fill="#58a6ff">03:</tspan> <tspan fill="#8b949e">SOFTWARE</tspan>
    </text>
    <circle cx="545" cy="219" r="1.5" fill="#30363d"/>

    <!-- Channel 04 -->
    <text x="635" y="222" text-anchor="middle">
      <tspan fill="#58a6ff">04:</tspan> <tspan fill="#8b949e">CLOUD</tspan>
    </text>
    <circle cx="725" cy="219" r="1.5" fill="#30363d"/>

    <!-- Channel 05 -->
    <text x="815" y="222" text-anchor="middle">
      <tspan fill="#58a6ff">05:</tspan> <tspan fill="#8b949e">DEPLOYMENT</tspan>
    </text>
  </g>
</svg>