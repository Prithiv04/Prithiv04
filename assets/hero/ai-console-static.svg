<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="PRITHIV // Visual AI Systems Monitor">
  <title>PRITHIV // Visual AI Systems Monitor</title>
  <desc>Real-time pipeline monitoring and dynamic feedback loop for intelligent systems engineering</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="consoleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10141d"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="consoleGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#ffffff" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Frame Background & Pattern -->
  <rect width="900" height="420" rx="10" fill="url(#consoleBg)"/>
  <rect width="900" height="420" rx="10" fill="url(#consoleGrid)"/>
  <rect x="0.5" y="0.5" width="899.0" height="419.0" rx="9.5" fill="none" stroke="#262c36" stroke-width="1"/>

  <!-- Terminal Top Bar -->
  <rect x="0" y="0" width="900" height="38" rx="10" fill="#131822"/>
  <rect x="0" y="28" width="900" height="10" fill="#131822"/>
  <line x1="0" y1="38" x2="900" y2="38" stroke="#262c36" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="19" r="5" fill="#3fb950"/>

  <!-- Title & Adaptive Loop Label -->
  <text x="450.0" y="23" fill="#8b949e" font-size="11" text-anchor="middle" letter-spacing="2.5">PRITHIV // AI SYSTEMS MONITOR</text>
  <text x="876.0" y="23" fill="#39c5cf" font-size="10.5" font-weight="600" text-anchor="end" letter-spacing="1.5">SYSTEM LOOP // ADAPTIVE</text>

  <!-- 1. Top Telemetry Indicators -->
  <g id="indicators">
    <!-- Indicator REASONING -->
    <rect x="44.0" y="52.0" width="196.0" height="36.0" rx="6" fill="#131822" stroke="#1f2633" stroke-width="1"/>
    <circle cx="58.0" cy="70.0" r="4" fill="#39c5cf">
      
    </circle>
    <text x="70.0" y="68.0" fill="#8b949e" font-size="8.5" letter-spacing="1">REASONING</text>
    <text x="70.0" y="79.0" fill="#39c5cf" font-size="9" font-weight="700" letter-spacing="1">ACTIVE</text>
    <!-- Indicator VALIDATION -->
    <rect x="249.0" y="52.0" width="196.0" height="36.0" rx="6" fill="#131822" stroke="#1f2633" stroke-width="1"/>
    <circle cx="263.0" cy="70.0" r="4" fill="#3fb950">
      
    </circle>
    <text x="275.0" y="68.0" fill="#8b949e" font-size="8.5" letter-spacing="1">VALIDATION</text>
    <text x="275.0" y="79.0" fill="#3fb950" font-size="9" font-weight="700" letter-spacing="1">DETERMINISTIC</text>
    <!-- Indicator AUTOMATION -->
    <rect x="454.0" y="52.0" width="196.0" height="36.0" rx="6" fill="#131822" stroke="#1f2633" stroke-width="1"/>
    <circle cx="468.0" cy="70.0" r="4" fill="#bc8cff">
      
    </circle>
    <text x="480.0" y="68.0" fill="#8b949e" font-size="8.5" letter-spacing="1">AUTOMATION</text>
    <text x="480.0" y="79.0" fill="#bc8cff" font-size="9" font-weight="700" letter-spacing="1">AGENT LOOP</text>
    <!-- Indicator DEPLOYMENT -->
    <rect x="659.0" y="52.0" width="196.0" height="36.0" rx="6" fill="#131822" stroke="#1f2633" stroke-width="1"/>
    <circle cx="673.0" cy="70.0" r="4" fill="#58a6ff">
      
    </circle>
    <text x="685.0" y="68.0" fill="#8b949e" font-size="8.5" letter-spacing="1">DEPLOYMENT</text>
    <text x="685.0" y="79.0" fill="#58a6ff" font-size="9" font-weight="700" letter-spacing="1">PRODUCTION</text>
  </g>

  <!-- Sub-bar Divider -->
  <line x1="36" y1="102" x2="864.0" y2="102" stroke="#262c36" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Pipeline Label -->
  <text x="44" y="126" fill="#58a6ff" font-size="10" letter-spacing="2" font-weight="700">▶ AUTONOMOUS EXECUTION PIPELINE</text>
  <text x="856.0" y="126" fill="#8b949e" font-size="9.5" text-anchor="end" letter-spacing="1">STATE: CONVERGED · CYCLE: 12ms</text>

  <!-- 2. Network Bus Tracks & Connections -->
  <line x1="144.0" y1="205.0" x2="246.0" y2="205.0" stroke="#283345" stroke-width="2"/>
  <path d="M 192.0 201.0 L 198.0 205.0 L 192.0 209.0" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.6"/>
  <line x1="314.0" y1="205.0" x2="416.0" y2="205.0" stroke="#283345" stroke-width="2"/>
  <path d="M 362.0 201.0 L 368.0 205.0 L 362.0 209.0" fill="none" stroke="#39c5cf" stroke-width="1.2" opacity="0.6"/>
  <line x1="484.0" y1="205.0" x2="586.0" y2="205.0" stroke="#283345" stroke-width="2"/>
  <path d="M 532.0 201.0 L 538.0 205.0 L 532.0 209.0" fill="none" stroke="#3fb950" stroke-width="1.2" opacity="0.6"/>
  <line x1="654.0" y1="205.0" x2="756.0" y2="205.0" stroke="#283345" stroke-width="2"/>
  <path d="M 702.0 201.0 L 708.0 205.0 L 702.0 209.0" fill="none" stroke="#bc8cff" stroke-width="1.2" opacity="0.6"/>

  <!-- Feedback Bus Loop -->
  <!-- Closed-Loop Feedback Bus -->
  <path d="M 790 239.0 C 790 300, 110 300, 110 239.0" fill="none" stroke="#283345" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="450.0" y="318" fill="#8b949e" font-size="8.5" text-anchor="middle" letter-spacing="2">ADAPTIVE FEEDBACK BUS // CONTINUOUS LEARNING</text>

  <!-- 3. Animated Signal Particles -->
  <circle cx="189.9" cy="205.0" r="2.5" fill="#58a6ff"/>
  <circle cx="359.9" cy="205.0" r="2.5" fill="#39c5cf"/>
  <circle cx="529.9" cy="205.0" r="2.5" fill="#3fb950"/>
  <circle cx="699.9" cy="205.0" r="2.5" fill="#bc8cff"/>
  <circle cx="450" cy="300" r="2.5" fill="#39c5cf"/>

  <!-- 4. Pipeline Nodes -->
  <!-- Node INPUT -->
  <g id="node-01">
    <!-- Outer Glow Ring -->
    <circle cx="110" cy="205.0" r="34" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3">
      
    </circle>
    <!-- Node Body -->
    <circle cx="110" cy="205.0" r="25.0" fill="#161c28" stroke="#58a6ff" stroke-width="1.6"/>
    <!-- Node Channel Tag -->
    <text x="110" y="198.0" fill="#58a6ff" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.5">INPUT</text>
    <text x="110" y="213.0" fill="#8b949e" font-size="7.5" text-anchor="middle" letter-spacing="1">[01]</text>
    <!-- Sub-label underneath -->
    <text x="110" y="253.0" fill="#8b949e" font-size="9" text-anchor="middle" letter-spacing="1.2">CONTEXT // EMBED</text>
  </g>
  <!-- Node REASON -->
  <g id="node-02">
    <!-- Outer Glow Ring -->
    <circle cx="280" cy="205.0" r="34" fill="none" stroke="#39c5cf" stroke-width="1" stroke-opacity="0.3">
      
    </circle>
    <!-- Node Body -->
    <circle cx="280" cy="205.0" r="25.0" fill="#161c28" stroke="#39c5cf" stroke-width="1.6"/>
    <!-- Node Channel Tag -->
    <text x="280" y="198.0" fill="#39c5cf" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.5">REASON</text>
    <text x="280" y="213.0" fill="#8b949e" font-size="7.5" text-anchor="middle" letter-spacing="1">[02]</text>
    <!-- Sub-label underneath -->
    <text x="280" y="253.0" fill="#8b949e" font-size="9" text-anchor="middle" letter-spacing="1.2">AGENT // INFER</text>
  </g>
  <!-- Node VALIDATE -->
  <g id="node-03">
    <!-- Outer Glow Ring -->
    <circle cx="450" cy="205.0" r="34" fill="none" stroke="#3fb950" stroke-width="1" stroke-opacity="0.3">
      
    </circle>
    <!-- Node Body -->
    <circle cx="450" cy="205.0" r="25.0" fill="#161c28" stroke="#3fb950" stroke-width="1.6"/>
    <!-- Node Channel Tag -->
    <text x="450" y="198.0" fill="#3fb950" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.5">VALIDATE</text>
    <text x="450" y="213.0" fill="#8b949e" font-size="7.5" text-anchor="middle" letter-spacing="1">[03]</text>
    <!-- Sub-label underneath -->
    <text x="450" y="253.0" fill="#8b949e" font-size="9" text-anchor="middle" letter-spacing="1.2">GROUND // AUDIT</text>
  </g>
  <!-- Node EXECUTE -->
  <g id="node-04">
    <!-- Outer Glow Ring -->
    <circle cx="620" cy="205.0" r="34" fill="none" stroke="#bc8cff" stroke-width="1" stroke-opacity="0.3">
      
    </circle>
    <!-- Node Body -->
    <circle cx="620" cy="205.0" r="25.0" fill="#161c28" stroke="#bc8cff" stroke-width="1.6"/>
    <!-- Node Channel Tag -->
    <text x="620" y="198.0" fill="#bc8cff" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.5">EXECUTE</text>
    <text x="620" y="213.0" fill="#8b949e" font-size="7.5" text-anchor="middle" letter-spacing="1">[04]</text>
    <!-- Sub-label underneath -->
    <text x="620" y="253.0" fill="#8b949e" font-size="9" text-anchor="middle" letter-spacing="1.2">DISPATCH // TOOL</text>
  </g>
  <!-- Node OBSERVE -->
  <g id="node-05">
    <!-- Outer Glow Ring -->
    <circle cx="790" cy="205.0" r="34" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3">
      
    </circle>
    <!-- Node Body -->
    <circle cx="790" cy="205.0" r="25.0" fill="#161c28" stroke="#58a6ff" stroke-width="1.6"/>
    <!-- Node Channel Tag -->
    <text x="790" y="198.0" fill="#58a6ff" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.5">OBSERVE</text>
    <text x="790" y="213.0" fill="#8b949e" font-size="7.5" text-anchor="middle" letter-spacing="1">[05]</text>
    <!-- Sub-label underneath -->
    <text x="790" y="253.0" fill="#8b949e" font-size="9" text-anchor="middle" letter-spacing="1.2">TELEMETRY // EVAL</text>
  </g>

  <!-- Lower Monitor Divider -->
  <line x1="0" y1="352" x2="900" y2="352" stroke="#262c36" stroke-width="1"/>

  <!-- 5. Bottom Signal Waveform & Diagnostics -->
  <g id="waveform-telemetry">
    <!-- Waveform Track -->
    <text x="44" y="379" fill="#39c5cf" font-size="9.5" font-weight="600" letter-spacing="1">SIGNAL // TOKEN FLUX:</text>
    <path d="M 50 376 L 80 376 L 90 368 L 100 384 L 110 364 L 120 388 L 130 360 L 140 376 L 170 376 L 180 366 L 190 386 L 200 362 L 210 376 L 250 376 L 260 370 L 270 382 L 280 376 L 320 376" fill="none" stroke="#283345" stroke-width="1.5"/>
    <path d="M 50 376 L 80 376 L 90 368 L 100 384 L 110 364 L 120 388 L 130 360 L 140 376 L 170 376 L 180 366 L 190 386 L 200 362 L 210 376 L 250 376 L 260 370 L 270 382 L 280 376 L 320 376" fill="none" stroke="#39c5cf" stroke-width="1.5" stroke-dasharray="60 210">
      
    </path>

    <!-- Center Diagnostics -->
    <text x="450.0" y="380" fill="#8b949e" font-size="9.5" text-anchor="middle" letter-spacing="1.2">
      INFERENCE: <tspan fill="#3fb950">STEADY</tspan> &#160;·&#160; LATENCY: <tspan fill="#39c5cf">14ms</tspan> &#160;·&#160; GUARDRAILS: <tspan fill="#f0f6fc">ENFORCED</tspan>
    </text>

    <!-- Right Telemetry State -->
    <circle cx="730.0" cy="376" r="3.5" fill="#3fb950"/>
    <text x="876.0" y="380" fill="#8b949e" font-size="9.5" text-anchor="end" letter-spacing="1">
      MONITOR: <tspan fill="#3fb950">ONLINE</tspan>
    </text>
  </g>
</svg>