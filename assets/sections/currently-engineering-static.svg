<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Currently Engineering Focus Map">
  <title>Currently Engineering Focus Map</title>
  <desc>Structured engineering progression: BUILD -> ENGINEER -> SYSTEMIZE -> EXPLORE -> COLLABORATE</desc>

  <defs>
    <linearGradient id="focusBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Frame Background & Hairline Border -->
  <rect width="900" height="330" rx="10" fill="url(#focusBg)"/>
  <rect x="0.5" y="0.5" width="899.0" height="329.0" rx="9.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Top Progression Ribbon -->
  <rect x="0" y="0" width="900" height="36" rx="10" fill="#161b22"/>
  <rect x="0" y="26" width="900" height="10" fill="#161b22"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Progression Label -->
  <text x="36" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#57606a" letter-spacing="1.5">TRAJECTORY:</text>
  <text x="130" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="1.5">
    <tspan fill="#58a6ff" font-weight="700">BUILD</tspan> &#160;──►&#160; <tspan fill="#39c5cf" font-weight="700">ENGINEER</tspan> &#160;──►&#160; <tspan fill="#58a6ff" font-weight="700">SYSTEMIZE</tspan> &#160;──►&#160; <tspan fill="#bc8cff" font-weight="700">EXPLORE</tspan> &#160;──►&#160; <tspan fill="#3fb950" font-weight="700">COLLABORATE</tspan>
  </text>
  <text x="864.0" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#58a6ff" text-anchor="end" letter-spacing="1">FOCUS: AI / ML ENGINEERING</text>

  <!-- Vertical Timeline Guide Line on Left -->
  <line x1="104" y1="74" x2="104" y2="218" stroke="#30363d" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- 5 Engineering Focus Stages -->
    <!-- Stage 1: BUILDING -->
    <g id="stage-1">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="62.0" width="124" height="24" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="74.0" r="2.5" fill="#58a6ff"/>
      <text x="110" y="77.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#58a6ff" text-anchor="middle" letter-spacing="1.2">BUILDING</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="74.0" x2="182" y2="74.0" stroke="#30363d" stroke-width="1.2"/>
      <path d="M 178 70.0 L 184 74.0 L 178 78.0" fill="none" stroke="#58a6ff" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="78.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="700" fill="#f0f6fc">AI AGENTS</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">MULTI-AGENT SYSTEMS</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">LLM APPLICATIONS</tspan>
      </text>
    </g>
    <!-- Stage 2: ENGINEERING -->
    <g id="stage-2">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="98.0" width="124" height="24" rx="4" fill="#161b22" stroke="#39c5cf" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="110.0" r="2.5" fill="#39c5cf"/>
      <text x="110" y="113.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#39c5cf" text-anchor="middle" letter-spacing="1.2">ENGINEERING</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="110.0" x2="182" y2="110.0" stroke="#30363d" stroke-width="1.2"/>
      <path d="M 178 106.0 L 184 110.0 L 178 114.0" fill="none" stroke="#39c5cf" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="114.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="700" fill="#f0f6fc">RAG</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">VECTOR SEARCH</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">TOOL CALLING</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">MODEL EVALUATION</tspan>
      </text>
    </g>
    <!-- Stage 3: SYSTEMS -->
    <g id="stage-3">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="134.0" width="124" height="24" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="146.0" r="2.5" fill="#58a6ff"/>
      <text x="110" y="149.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#58a6ff" text-anchor="middle" letter-spacing="1.2">SYSTEMS</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="146.0" x2="182" y2="146.0" stroke="#30363d" stroke-width="1.2"/>
      <path d="M 178 142.0 L 184 146.0 L 178 150.0" fill="none" stroke="#58a6ff" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="150.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="700" fill="#f0f6fc">CLOUD DEPLOYMENT</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">REST APIs</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">BACKEND ARCHITECTURE</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">DATA PIPELINES</tspan>
      </text>
    </g>
    <!-- Stage 4: EXPLORING -->
    <g id="stage-4">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="170.0" width="124" height="24" rx="4" fill="#161b22" stroke="#bc8cff" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="182.0" r="2.5" fill="#bc8cff"/>
      <text x="110" y="185.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#bc8cff" text-anchor="middle" letter-spacing="1.2">EXPLORING</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="182.0" x2="182" y2="182.0" stroke="#30363d" stroke-width="1.2"/>
      <path d="M 178 178.0 L 184 182.0 L 178 186.0" fill="none" stroke="#bc8cff" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="186.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="500" fill="#c9d1d9">ADAPTIVE ML</tspan> &#160;&#183;&#160; <tspan font-weight="500" fill="#c9d1d9">REAL-TIME INFERENCE</tspan> &#160;&#183;&#160; <tspan font-weight="500" fill="#c9d1d9">EDGE AI</tspan>
      </text>
    </g>
    <!-- Stage 5: OPEN TO -->
    <g id="stage-5">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="206.0" width="124" height="24" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="218.0" r="2.5" fill="#3fb950"/>
      <text x="110" y="221.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#3fb950" text-anchor="middle" letter-spacing="1.2">OPEN TO</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="218.0" x2="182" y2="218.0" stroke="#30363d" stroke-width="1.2"/>
      <path d="M 178 214.0 L 184 218.0 L 178 222.0" fill="none" stroke="#3fb950" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="222.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="700" fill="#f0f6fc">AI/ML INTERNSHIPS</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">RESEARCH</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#f0f6fc">OPEN-SOURCE COLLABORATION</tspan>
      </text>
    </g>

  <!-- Divider Above Center Statement -->
  <line x1="36" y1="262" x2="864.0" y2="262" stroke="#30363d" stroke-width="1"/>
  <circle cx="450.0" cy="262" r="2.5" fill="#58a6ff"/>

  <!-- Distinctive Center Statement -->
  <text x="450.0" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700"
    fill="#58a6ff" text-anchor="middle" letter-spacing="2.5">
    MODELS &#160;→&#160; AGENTS &#160;→&#160; DATA &#160;→&#160; SYSTEMS &#160;→&#160; DEPLOYMENT
  </text>

  <text x="450.0" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic"
    fill="#8b949e" text-anchor="middle" letter-spacing="0.2">
    Building intelligent software that can reason, use tools, process evidence, and operate as reliable systems.
  </text>
</svg>