<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Currently Engineering Focus Map">
  <title>Currently Engineering Focus Map</title>
  <desc>Structured engineering progression: MODEL -> AGENT -> DATA -> SYSTEM -> DEPLOY</desc>

  <defs>
    <linearGradient id="focusBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>

  <!-- Frame Background & Hairline Border -->
  <rect width="900" height="330" rx="10" fill="url(#focusBg)"/>
  <rect x="0.5" y="0.5" width="899.0" height="329.0" rx="9.5" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <!-- Top Progression Ribbon -->
  <rect x="0" y="0" width="900" height="36" rx="10" fill="#f6f8fa"/>
  <rect x="0" y="26" width="900" height="10" fill="#f6f8fa"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#d0d7de" stroke-width="1"/>

  <!-- Progression Label -->
  <text x="36" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#8c959f" letter-spacing="1.5">TRAJECTORY:</text>
  <text x="130" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="1.5">
    <tspan fill="#0969da" font-weight="700">MODEL</tspan> &#160;──►&#160; <tspan fill="#0550ae" font-weight="700">AGENT</tspan> &#160;──►&#160; <tspan fill="#0969da" font-weight="700">DATA</tspan> &#160;──►&#160; <tspan fill="#8250df" font-weight="700">SYSTEM</tspan> &#160;──►&#160; <tspan fill="#1a7f37" font-weight="700">DEPLOY</tspan>
  </text>
  <text x="864.0" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#0969da" text-anchor="end" letter-spacing="1">FOCUS: AI / ML ENGINEERING</text>

  <!-- Vertical Timeline Guide Line on Left -->
  <line x1="104" y1="74" x2="104" y2="218" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- 5 Engineering Focus Stages -->
    <!-- Stage 1: BUILDING -->
    <g id="stage-1">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="62.0" width="124" height="24" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="74.0" r="2.5" fill="#0969da"/>
      <text x="110" y="77.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#0969da" text-anchor="middle" letter-spacing="1.2">BUILDING</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="74.0" x2="182" y2="74.0" stroke="#d0d7de" stroke-width="1.2"/>
      <path d="M 178 70.0 L 184 74.0 L 178 78.0" fill="none" stroke="#0969da" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="78.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="700" fill="#1f2328">AI AGENTS</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">MULTI-AGENT SYSTEMS</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">LLM APPLICATIONS</tspan>
      </text>
    </g>
    <!-- Stage 2: ENGINEERING -->
    <g id="stage-2">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="98.0" width="124" height="24" rx="4" fill="#f6f8fa" stroke="#0550ae" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="110.0" r="2.5" fill="#0550ae"/>
      <text x="110" y="113.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#0550ae" text-anchor="middle" letter-spacing="1.2">ENGINEERING</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="110.0" x2="182" y2="110.0" stroke="#d0d7de" stroke-width="1.2"/>
      <path d="M 178 106.0 L 184 110.0 L 178 114.0" fill="none" stroke="#0550ae" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="114.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="700" fill="#1f2328">RAG</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">VECTOR SEARCH</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">TOOL CALLING</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">MODEL EVALUATION</tspan>
      </text>
    </g>
    <!-- Stage 3: SYSTEMS -->
    <g id="stage-3">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="134.0" width="124" height="24" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="146.0" r="2.5" fill="#0969da"/>
      <text x="110" y="149.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#0969da" text-anchor="middle" letter-spacing="1.2">SYSTEMS</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="146.0" x2="182" y2="146.0" stroke="#d0d7de" stroke-width="1.2"/>
      <path d="M 178 142.0 L 184 146.0 L 178 150.0" fill="none" stroke="#0969da" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="150.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="700" fill="#1f2328">CLOUD DEPLOYMENT</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">REST APIs</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">BACKEND ARCHITECTURE</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">DATA PIPELINES</tspan>
      </text>
    </g>
    <!-- Stage 4: EXPLORING -->
    <g id="stage-4">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="170.0" width="124" height="24" rx="4" fill="#f6f8fa" stroke="#8250df" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="182.0" r="2.5" fill="#8250df"/>
      <text x="110" y="185.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#8250df" text-anchor="middle" letter-spacing="1.2">EXPLORING</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="182.0" x2="182" y2="182.0" stroke="#d0d7de" stroke-width="1.2"/>
      <path d="M 178 178.0 L 184 182.0 L 178 186.0" fill="none" stroke="#8250df" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="186.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="500" fill="#24292f">ADAPTIVE ML</tspan> &#160;&#183;&#160; <tspan font-weight="500" fill="#24292f">REAL-TIME INFERENCE</tspan> &#160;&#183;&#160; <tspan font-weight="500" fill="#24292f">EDGE AI</tspan>
      </text>
    </g>
    <!-- Stage 5: OPEN TO -->
    <g id="stage-5">
      <!-- Compact Technical Label Badge -->
      <rect x="42" y="206.0" width="124" height="24" rx="4" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="54" cy="218.0" r="2.5" fill="#1a7f37"/>
      <text x="110" y="221.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700"
        fill="#1a7f37" text-anchor="middle" letter-spacing="1.2">OPEN TO</text>

      <!-- Directional Connector Line & Chevron -->
      <line x1="166" y1="218.0" x2="182" y2="218.0" stroke="#d0d7de" stroke-width="1.2"/>
      <path d="M 178 214.0 L 184 218.0 L 178 222.0" fill="none" stroke="#1a7f37" stroke-width="1.4"/>

      <!-- Actual Technical Concepts (The Visual Focus) -->
      <text x="200" y="222.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.2">
        <tspan font-weight="700" fill="#1f2328">AI/ML INTERNSHIPS</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">RESEARCH</tspan> &#160;&#183;&#160; <tspan font-weight="700" fill="#1f2328">OPEN-SOURCE COLLABORATION</tspan>
      </text>
    </g>

  <!-- Divider Above Center Statement -->
  <line x1="36" y1="262" x2="864.0" y2="262" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="450.0" cy="262" r="2.5" fill="#0969da"/>

  <!-- Distinctive Center Statement -->
  <text x="450.0" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700"
    fill="#0969da" text-anchor="middle" letter-spacing="2.5">
    MODELS &#160;→&#160; AGENTS &#160;→&#160; DATA &#160;→&#160; SYSTEMS &#160;→&#160; DEPLOYMENT
  </text>

  <text x="450.0" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic"
    fill="#57606a" text-anchor="middle" letter-spacing="0.2">
    Building intelligent software that can reason, use tools, process evidence, and operate as reliable systems.
  </text>
</svg>