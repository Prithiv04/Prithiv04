<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Selected Recognition Milestones">
  <title>Selected Recognition Milestones</title>
  <desc>Career milestones: Web3 Conference Hackathon Winner, Cardano Hackathon Asia Top 5, NASA Space Apps Challenge Finalist</desc>

  <defs>
    <linearGradient id="recogBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Frame Background & Hairline Border -->
  <rect width="900" height="200" rx="10" fill="url(#recogBg)"/>
  <rect x="0.5" y="0.5" width="899.0" height="199.0" rx="9.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Top Technical Header Line -->
  <line x1="0" y1="30" x2="900" y2="30" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#57606a" letter-spacing="1.5">CAREER MILESTONES // VERIFIED RECOGNITION</text>
  <text x="864.0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#58a6ff" text-anchor="end" letter-spacing="1">CHRONOLOGY: 2024</text>

  <!-- Continuous Horizontal Timeline Connection -->
  <line x1="80" y1="66.0" x2="820" y2="66.0" stroke="#21262d" stroke-width="1.6"/>
  <circle cx="80" cy="66.0" r="2" fill="#58a6ff"/>
  <circle cx="820" cy="66.0" r="2" fill="#58a6ff"/>

  <!-- Subtle Signal Particle on Timeline -->
  <circle cy="66.0" r="3" fill="#39c5cf">
    <animate attributeName="cx" from="80" to="820" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Milestones -->
    <!-- Milestone 01 -->
    <g id="ms-01">
      <!-- Large Watermark Numeral -->
      <text x="160.0" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="42" font-weight="800"
        fill="#1e2530" text-anchor="middle" letter-spacing="-1">01</text>

      <!-- Node Outer Ring & Inner Dot -->
      <circle cx="160.0" cy="66.0" r="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.8">
        <animate attributeName="r" values="6;8;6" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160.0" cy="66.0" r="2.5" fill="#3fb950"/>

      <!-- Milestone Title -->
      <text x="160.0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700"
        fill="#f0f6fc" text-anchor="middle" letter-spacing="0.5">WEB3 CONFERENCE HACKATHON</text>

      <!-- Result & Location Metadata -->
      <text x="160.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5"
        fill="#8b949e" text-anchor="middle" letter-spacing="1">
        <tspan fill="#3fb950" font-weight="700">WINNER</tspan> &#160;&#183;&#160; DELHI · 2024
      </text>
    </g>
    <!-- Milestone 02 -->
    <g id="ms-02">
      <!-- Large Watermark Numeral -->
      <text x="450.0" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="42" font-weight="800"
        fill="#1e2530" text-anchor="middle" letter-spacing="-1">02</text>

      <!-- Node Outer Ring & Inner Dot -->
      <circle cx="450.0" cy="66.0" r="6" fill="#0d1117" stroke="#39c5cf" stroke-width="1.8">
        <animate attributeName="r" values="6;8;6" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="450.0" cy="66.0" r="2.5" fill="#39c5cf"/>

      <!-- Milestone Title -->
      <text x="450.0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700"
        fill="#f0f6fc" text-anchor="middle" letter-spacing="0.5">CARDANO HACKATHON ASIA</text>

      <!-- Result & Location Metadata -->
      <text x="450.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5"
        fill="#8b949e" text-anchor="middle" letter-spacing="1">
        <tspan fill="#39c5cf" font-weight="700">TOP 5</tspan> &#160;&#183;&#160; ASIA REGION
      </text>
    </g>
    <!-- Milestone 03 -->
    <g id="ms-03">
      <!-- Large Watermark Numeral -->
      <text x="740.0" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="42" font-weight="800"
        fill="#1e2530" text-anchor="middle" letter-spacing="-1">03</text>

      <!-- Node Outer Ring & Inner Dot -->
      <circle cx="740.0" cy="66.0" r="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1.8">
        <animate attributeName="r" values="6;8;6" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="740.0" cy="66.0" r="2.5" fill="#bc8cff"/>

      <!-- Milestone Title -->
      <text x="740.0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700"
        fill="#f0f6fc" text-anchor="middle" letter-spacing="0.5">NASA SPACE APPS CHALLENGE</text>

      <!-- Result & Location Metadata -->
      <text x="740.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5"
        fill="#8b949e" text-anchor="middle" letter-spacing="1">
        <tspan fill="#bc8cff" font-weight="700">FINALIST</tspan> &#160;&#183;&#160; GLOBAL NOMINEE
      </text>
    </g>

  <!-- Subtle Bottom Bar -->
  <line x1="36" y1="168" x2="864.0" y2="168" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="450.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#57606a" text-anchor="middle" letter-spacing="1.8">
    PROVEN CAPABILITIES IN AUTONOMOUS AGENTS, DISTRIBUTED SYSTEMS &amp; REMOTE SENSING
  </text>
</svg>