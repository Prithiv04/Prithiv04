<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 30" width="138" height="30" role="img" aria-label="PORTFOLIO">
  <title>PORTFOLIO ↗</title>
  <defs>
    <style>
      .pill-box {
        fill: #f6f8fa;
        stroke: #d0d7de;
        stroke-width: 1;
        transition: all 0.2s ease-in-out;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #1f2328;
        letter-spacing: 0.8px;
        transition: fill 0.2s ease-in-out;
      }
      .pill-arrow {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #57606a;
        transition: fill 0.2s ease-in-out;
      }
      .pill-icon {
        color: #008694;
        transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
      }
      svg:hover .pill-box {
        fill: #ffffff;
        stroke: #008694;
        stroke-width: 1.2;
      }
      svg:hover .pill-text {
        fill: #008694;
      }
      svg:hover .pill-arrow {
        fill: #008694;
      }
      svg:hover .pill-icon {
        filter: drop-shadow(0 0 3px rgba(57, 197, 207, 0.4));
      }
    </style>
  </defs>

  <!-- Background Pill Track -->
  <rect class="pill-box" x="0.5" y="0.5" width="137" height="29" rx="5"/>

  <!-- Platform Icon -->
  <g class="pill-icon" transform="translate(10.0, 7.0)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<line x1="1.5" y1="8" x2="14.5" y2="8" stroke="currentColor" stroke-width="1.2"/>
<path d="M8 1.5 C5.5 4 4.5 6 4.5 8 C4.5 10 5.5 12 8 14.5 C10.5 12 11.5 10 11.5 8 C11.5 6 10.5 4 8 1.5 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
    </svg>
  </g>

  <!-- Platform Label -->
  <text class="pill-text" x="34.0" y="18.5">PORTFOLIO</text>

  <!-- External Arrow Indicator -->
  <text class="pill-arrow" x="126.0" y="18.5" text-anchor="end">↗</text>
</svg>