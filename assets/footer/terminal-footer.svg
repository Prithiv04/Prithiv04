<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80" role="img" aria-label="PRITHIV system terminal footer">
  <defs>
    <clipPath id="clip-footer-text">
      <rect x="0" y="0" width="0" height="80">
        <animate attributeName="width" from="0" to="900" dur="1.2s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <filter id="glow-f">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="80" rx="8" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="78" rx="7" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Left status pulse -->
  <circle cx="28" cy="40" r="5" fill="#3fb950" filter="url(#glow-f)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer content -->
  <g clip-path="url(#clip-footer-text)">
    <text x="46" y="36" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" fill="#8b949e" letter-spacing="1">
      <tspan fill="#58a6ff">PRITHIV</tspan> // AI ENGINEERING SYSTEM
    </text>
    <text x="46" y="56" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" fill="#8b949e">
      <tspan fill="#3fb950">$</tspan>  Thanks for visiting. Building systems that matter.
    </text>

    <!-- Right: social quick links text -->
    <text x="720" y="36" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#8b949e" text-anchor="end" letter-spacing="2">CONNECT</text>
    <text x="720" y="54" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#58a6ff" text-anchor="end">LinkedIn · GitHub · Email</text>

    <!-- Blinking cursor -->
    <rect x="860" y="31" width="7" height="12" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Version tag -->
  <text x="875" y="68" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="#30363d" text-anchor="end">v2.0</text>
</svg>
